level: INFO

logger:
  name: architecture-build
  propagate: true

console:
  enabled: true
  level: INFO

file:
  enabled: true
  level: INFO
  directory: logs
  filename: application.log

  rotation:
    enabled: true
    when: midnight
    interval: 1
    backup_count: 30

format:
  type: json          # json | text

  text: "%(asctime)s | %(levelname)s | %(name)s | %(filename)s:%(lineno)d | %(message)s"

  json:
    timestamp: "%(asctime)s"
    level: "%(levelname)s"
    logger: "%(name)s"
    module: "%(module)s"
    function: "%(funcName)s"
    line: "%(lineno)d"
    process: "%(process)d"
    thread: "%(threadName)s"
    message: "%(message)s"

request_logging:
  enabled: true
  log_request_body: false
  log_response_body: false
  log_headers: false

performance:
  enabled: true
  slow_request_threshold_ms: 1000

exception_logging:
  include_traceback: true

access_log:
  enabled: true
application:
  name: "Market Data Extractor"
  version: "1.0.0"
  description: "Market Data Extractor is a Python application that extracts market data from various sources and processes it for analysis and storage."
  environment: "development"
  debug: true

extractor_settings:
  client: "Upstox"
  max_retries: 3
  retry_delay: 5
  processable_segments:
    - "NSE_INDEX"
    - "NSE_FO"
    - "BSE_INDEX"
    - "BSE_FO"
    - "MCX_FO"
  access_token_path: ""
upstox:
  # All available segments for Upstox - uncomment to enable
  processable_segments:
  - MCX_FO
  - NSE_INDEX
  - BSE_INDEX
  - BSE_FO
  - NSE_FO
  # Available but disabled segments (uncomment to enable):
  # - BCD_FO
  # - BSE_EQ
  # - GLOBAL_INDEX
  # - NSE_EQ
  # - NCD_FO
  # - GLOBAL_INDICATOR
  # - NSE_COM
  # - BSE_COM
  # - NSE_CURRENCY
  # - BSE_CURRENCY
  session_bounds:
    NSE_INDEX:
      start: 09:15
      end: '15:40'
    NSE_FO:
      start: 09:15
      end: '15:40'
    BSE_INDEX:
      start: 09:15
      end: '15:40'
    BSE_FO:
      start: 09:15
      end: '15:40'
    MCX_FO:
      start: 09:15
      end: '23:30'
    BSE_COM:
      start: 09:15
      end: '23:30'
    NSE_COM:
      start: 09:15
      end: '23:30'
  symbol_name_mapping:
    NIFTY FIN SERVICE: FINNIFTY
    NIFTY 50: NIFTY50
    Nifty50: NIFTY50
    INDIA VIX: VIX
    IndiaVix: VIX
    NIFTY BANK: BANKNIFTY
    BankNifty: BANKNIFTY
    Banknifty: BANKNIFTY
    BSE BANKEX: BANKEX
    BSEBANKEX: BANKEX
    BSE SENSEX: SENSEX
    BSESENSEX: SENSEX

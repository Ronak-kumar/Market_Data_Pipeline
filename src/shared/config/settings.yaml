application:
  name: Market Data Extractor
  version: 1.0.0
  description: ''
  environment: development
  debug: false
extractor_settings:
  client: upstox
  interval: 1
  max_retries: 3
  expiry_duration: 3
  start_date: '2026-10-29'
  end_date: '2026-10-29'
ingestion_settings:
  enabled: true
  target: clickhouse
  batch_size: 10000
  create_tables: true
cloud_settings:
  client: aws
  push_to_cloud: true
  storage_name: marketdata-pipeline
  destination_folder: market_data_storage
broker_configuration:
  upstox:
    processable_segments:
    - MCX_FO
    - '# BCD_FO'
    - '# BSE_EQ'
    - '# NSE_INDEX'
    - '# GLOBAL_INDEX'
    - '# NSE_EQ'
    - BSE_INDEX
    - BSE_FO
    - '# NCD_FO'
    - '# GLOBAL_INDICATOR'
    - NSE_COM
    - '# NSE_FO'
    session_bounds: {}
    symbol_name_mapping: {}

# =============================================================================
# Market Data Pipeline - Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. Place broker tokens in ./access_token/
#   3. Run: docker compose up -d
# =============================================================================

services:
  # Main API server with config editor UI
  api:
    build: .
    container_name: market-data-api
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./access_token:/app/access_token:ro
      - ./src/shared/config:/app/src/shared/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Extraction worker (runs the pipeline)
  extractor:
    build: .
    container_name: market-data-extractor
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./access_token:/app/access_token:ro
      - ./src/shared/config:/app/src/shared/config:ro
    profiles:
      - worker

  # Transformation worker (Bronze to Silver)
  transformer:
    build: .
    container_name: market-data-transformer
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./src/shared/config:/app/src/shared/config:ro
    profiles:
      - worker

  # Ingestion worker (Silver to Database)
  ingestion:
    build: .
    container_name: market-data-ingestion
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./src/shared/config:/app/src/shared/config:ro
    profiles:
      - worker

networks:
  default:
    name: market-data-network
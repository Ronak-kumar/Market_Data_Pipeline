[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3[crt]>=1.43.83",
    "pandas==2.3.3",
    "polars==1.43.2",
    "pyarrow==25.0.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "pyyaml==6.0.2",
    "requests==2.32.4",
    "tqdm>=4.66,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/extraction",
    "src/transformation",
    "src/shared",
]
